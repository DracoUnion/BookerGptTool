paper: 2608.30192.pdf
desc: 该论文提出 FaVOR（Factor Validation through Observable Reasoning），一种基于 LLM 的智能体框架，将因子挖掘重构为以假设级证据而非回报结果为中心的过程。FaVOR
  通过一个三阶段一致性循环将因子的数学形式与经济含义绑定：(1) 分解（Decomposition）将宽泛的经济假设拆解为独立的可观测市场条件；(2) 验证（Validation）在训练数据上检查每个候选因子是否反映了其预期的条件；(3)
  整合（Integration）将通过验证的因子合并为结构可解释的复合信号。在 2025 年 CSI 500 与 S&P 500 的样本外测试中，FaVOR 在所有指标上优于现有基线并在不同市场机制下保持有效，表明基于假设的因子发现能够产生可解释、机制稳健且经济忠实的信号。
concepts:
- name: FaVOR (Factor Validation through Observable Reasoning)
  desc: 论文提出的原创智能体框架，通过三阶段一致性循环将因子的数学形式与经济含义绑定，而非直接优化回报。
  is_original: true
  excerpt:
  - We propose FaVOR (Factor Validation through Observable Reasoning), an agentic
    framework that restructures factor mining around hypothesis-level evidence rather
    than return outcomes.
  - By admitting only factors that pass all three stages, FaVOR builds structurally
    interpretable factors that combine empirical performance with economic rationale.
  page: 1-3
- name: Structural failure mode of return-oriented automation
  desc: 以回报为导向的自动化所导致的结构性失效模式，表现为因子的数学形式与其经济含义之间不一致，使得仅拟合训练窗口内不透明相关性的公式与基于真实经济机制构建的因子难以区分，并在机制切换时崩溃。
  is_original: true
  excerpt:
  - We identify this inconsistency between mathematical form and economic meaning
    as a structural failure mode of return-oriented automation.
  - Without such validation, formulas that merely fit opaque correlations in the training
    window can appear indistinguishable from factors built on genuine economic mechanisms.
    Such formulas look strong in-sample but tend to break down when market regimes
    shift.
  page: '1'
- name: Hypothesis Decomposition (Stage 1)
  desc: 将自然语言表达的经济假设拆解为 m 个独立、可观测的市场条件，每个条件捕捉假设的一个不同维度（如抛售状态、日内反弹、早期稳定），使假设可被实证检验。
  is_original: true
  excerpt:
  - The observation agent AO decomposes h into m observable market conditions, AO(h)
    = {oi | i = 1, . . . , m}, where each oi captures a distinct and independent aspect
    of the hypothesis.
  - Stage 1 turns a high-level economic hypothesis into measurable components.
  page: 3-4
- name: Factor-Level Validation (Stage 2)
  desc: 在训练数据上（使用时间 t 的市场变量而非未来回报）检查候选因子是否体现了其对应的经济条件，通过量化箱分布证据判定一致性，而非评估因子的预测回报。
  is_original: true
  excerpt:
  - Factor-level validation verifies whether each formula embodies the economic rationale
    of its corresponding observable market condition. It uses market variables observed
    at time t rather than future returns at t+T
  - The validation agent AV checks whether a candidate factor measures the observable
    market condition it was generated for. The goal is to test whether stronger factor
    values correspond to stronger evidence of the market state described in oi, not
    whether the factor predicts future returns.
  page: 4-5
- name: Factor-conditioned market statistics (Si,j)
  desc: 将股票按因子值排序后分入 quintile 箱，再用四个 OHLCV 变量（日内回报 DIR、价格区间 MAG、收盘位置 POS、交易量 VOL）计算均值、中位数、q10、q90
    等描述性统计画像，作为评估因子一致性的证据。
  is_original: true
  excerpt:
  - For each bin and each x ∈X, we compute standard descriptive statistics (mean,
    median, q10, q90, and dispersion measures), and collect them into the statistical
    profile Si,j that AV uses to assess factor consistency.
  page: 4-5
- name: Four consistency checks
  desc: 验证 agent 使用的四条确定性规则：(i) 某个状态变量在有序因子箱间的中心趋势系统性偏移；(ii) 尾部展布跨箱的非平凡变化；(iii) 同一变量至少两个互补统计量的一致；(iv)
    诱导分布模式与 oi 文本描述的语义一致。
  is_original: true
  excerpt:
  - 'We apply four consistency checks: (i) a systematic shift in central tendency
    of some x ∈X across the ordered factor bins, (ii) non-trivial variation in the
    tail spread of x across bins, (iii) agreement across at least two complementary
    statistics of the same x, and (iv) semantic agreement with oi.'
  - Given this mapping, the final pass/fail decision is deterministic because it is
    the conjunction of four explicit rule checks.
  page: 4-5
- name: Directional Selectivity (Stage 3)
  desc: 因子组合的属性：随着进入规则的选择性 σ 提高，其实现回报的方向保持稳定，赢率提高，表明更强的信号产生更少的假阳性；只有当该属性在 ticker 层面得到足够支持时组合才被保留。
  is_original: true
  excerpt:
  - We call this property Directional Selectivity. The entry rule uses a common selectivity
    level σ ∈(0, 1) that determines the cross-sectional extremeness required from
    each factor.
  - Increasing σ tightens each factor's quantile cutoff and makes the joint signal
    more selective. It reduces the number of trading opportunities and keeps only
    stronger realizations of the hypothesized market state.
  page: 5-6
- name: Factor Integration via Cartesian product
  desc: 将每个已验证条件的因子集做笛卡尔积形成候选组合，并通过联合阈值与选择性阶梯筛选出能最好重构原始假设的组合。
  is_original: true
  excerpt:
  - We form candidate combinations by taking the Cartesian product C = ˆF1 × ˆF2 ×
    · · · × ˆFm with cardinality |C| = Qm i=1 | ˆFi|, and each f ∈C selects one validated
    factor per observable condition.
  page: 5-6
- name: Hypothesis Memory (outer-loop)
  desc: 外部循环中的反馈机制，每次迭代后记录先验假设 ID、观测描述、公式名称与平均信息比率的标量汇总，不存储原始回报、公式定义或拟合阈值，用于在迭代间调整假设（如
    horizon_days）。
  is_original: true
  excerpt:
  - After each iteration, FaVOR records prior hypothesis IDs, observation descriptions,
    formula names, and a single scalar summary of average information ratio. The memory
    does not store raw returns, formula definitions, or fitted thresholds, and the
    pipeline code and hyperparameters are fixed before held-out evaluation.
  page: 6-7
methods:
- name: __overview__
  desc: FaVOR 整体方法论：从人类市场洞察出发，依次经过假设生成 → 假设分解 → 候选因子生成（Stage 1），对每个候选因子做因子级验证（Stage
    2），将通过验证的因子整合为方向选择性组合（Stage 3），最后在验证集上优化阈值并在持有期外回测（Stage 4），形成外部循环的假设记忆。
  excerpt:
  - We propose FaVOR, an agentic framework that constructs structurally interpretable
    factors from economic hypotheses. The framework does not evaluate a hypothesis
    solely by its final return. Instead, it first decomposes the hypothesis into observable
    market conditions, then checks whether candidate factors measure those conditions,
    and finally integrates the validated factors into executable trading signals.
  - 'Figure 2: Overview of the FaVOR framework: a three-stage pipeline for hypothesis-driven
    factor mining.'
  page: 3-7
- name: Hypothesis Generation Agent (A_H)
  desc: 将人类市场洞察 I 转化为一个描述性经济假设 h = A_H(I)，说明市场状态及其对价格 movement 的预期影响，并需指定 1–10 天的
    holding horizon_days。
  excerpt:
  - The hypothesis agent AH takes human market insights I and returns an economic
    hypothesis AH(I) = h. The hypothesis h is a descriptive statement about market
    states and their expected impact on price movements.
  - You MUST specify 'horizon_days' as an integer between 1 and 10.
  page: 3-4
- name: Hypothesis Decomposition Agent (A_O)
  desc: 将自然语言假设 h 分解为 m 个可观测市场条件 {o_i}，每个条件捕捉假设的一个不同维度（价格位移、交易活动、方向性偏差、波动性/不稳定性或相对近期行为的价格延伸），且需至少包含一个
    transition observation。
  excerpt:
  - The hypothesis h is written in natural language, so it cannot be validated directly
    against raw market data. The observation agent AO decomposes h into m observable
    market conditions, AO(h) = {oi | i = 1, . . . , m}, where each oi captures a distinct
    and independent aspect of the hypothesis.
  - For each hypothesis, include at least one transition observation that describes
    evidence the current market state is evolving in a way that supports the hypothesized
    direction
  page: 3-4
- name: Candidate Factor Generation Agent (A_F)
  desc: 给定一个可观测条件 o_i，生成 n_i 个候选因子公式 f_{i,j}，全部由预定义的确定性算子库（附录 A）作用于原始 OHLCV 输入构成，保证公式可解释、可执行且无未来引用。
  excerpt:
  - Given an observable market condition oi, the factor agent AF generates ni candidate
    factors, AF (oi) = Fi = {fi,j}ni j=1. Each candidate factor fi,j is a formula
    computed from market data and intended to measure oi.
  - To keep the formulas interpretable and executable, AF draws operators from the
    predefined set in Appendix A.
  page: 3-4
- name: Factor-Level Validation (Validation Agent A_V)
  desc: 对每个候选因子，先在训练数据上计算因子值、按日期横截面排序并分入 quintile 箱，再用 OHLCV 变量构建统计画像 S_{i,j}，然后由验证
    agent 按四条确定性规则判定 pass/fail，只有全部满足才进入已验证因子集。
  excerpt:
  - For each candidate factor, we compute factor values on the training data, sort
    stocks within each date, and split them into quintile bins Q1, . . . , Q5 ordered
    from low to high.
  - 'AV (oi, fi,j, Si,j) = I [ ^ c∈K c(oi, fi,j, Si,j) ] , where I[·] is the pass/fail
    indicator. The validated factor set for condition oi is then ˆFi = {fi,j ∈Fi :
    AV (oi, fi,j, Si,j) = pass}.'
  page: 4-5
- name: Factor Integration with Directional Selectivity (Stage 3)
  desc: 对每个条件的已验证因子集做笛卡尔积形成候选组合，用共同选择性水平 σ 定义联合进入规则（仅当所有组成因子同时触发才发信号），并在选择性阶梯上评估赢率与平均实现回报的稳定性以筛选方向一致的组合。
  excerpt:
  - Each combination f ∈C needs an entry rule that we can vary in selectivity, so
    we can test whether the direction of its realized return remains stable as the
    rule tightens.
  - A ticker supports the combination only when at least one of these behaviors holds
    across the ladder. We then retain a factor combination only when its ticker-level
    support rate exceeds a fixed pass-rate threshold
  page: 5-6
- name: Threshold Optimization and Backtesting (Stage 4)
  desc: 在保留的验证集上用 Optuna 以 Calmar ratio（年化回报/最大回撤绝对值）为目标为每个已验证组合优化因子特定阈值，固定后在测试期回测；评估结果仅用于外部循环的假设记忆。
  excerpt:
  - Because each factor in a combination targets a distinct observable condition,
    we treat its activation cutoff as independent and optimize factor-specific thresholds
    for each validated combination with Optuna (Akiba et al., 2019).
  - The optimization objective is the Calmar ratio (Eling and Schuhmacher, 2007).
    It is defined as Calmar = AR/|MDD|
  page: 6-7
theorems:
- name: Deterministic validation decision rule
  desc: 形式化命题：候选因子被保留当且仅当四条一致性规则 c1–c4 的合取成立，即 AV(oi, fi,j, Si,j) = I[∧_{c∈K} c(oi,
    fi,j, Si,j)]，其中 K = {中心趋势偏移、尾部行为、多统计量一致性、语义一致性}，因此最终的 pass/fail 判定是确定性的而非无约束的语言模型判断。
  excerpt:
  - Let K = {c1, c2, c3, c4} denote the four criteria above. AV implements the deterministic
    decision AV (oi, fi,j, Si,j) = I [ ^ c∈K c(oi, fi,j, Si,j) ] , where I[·] is the
    pass/fail indicator.
  - A candidate factor is therefore retained only when all four criteria jointly hold.
  page: 12-13
- name: Structural interpretability claim
  desc: 核心命题：仅当因子通过全部三个阶段时，FaVOR 才能构建出在结构上可解释、且将经验表现与经济合理性相结合的因子；假设中心化的实证验证能够产生在机制间稳健的信号。
  excerpt:
  - By admitting only factors that pass all three stages, FaVOR builds structurally
    interpretable factors that combine empirical performance with economic rationale.
  - FaVOR shows that hypothesis-grounded factor discovery produces signals that are
    interpretable by construction, regime-robust, and economically faithful.
  page: 1-3
findings:
- name: CSI 500 main results
  desc: '[evidence] Table 1 显示 FaVOR 在 CSI 500 上达到 AR 0.2067、IR 1.5295、MDD −0.0853、CR
    0.2225，为所有比较方法中最佳。[claim] FaVOR 同时改善了回报生成并相对于每个比较方法降低了下行风险，在四个指标上均取得最优。'
  excerpt:
  - On the CSI 500, FaVOR achieves the best result across all four metrics, reaching
    AR of 0.2067, IR of 1.5295, MDD of −0.0853, and CR of 0.2225, simultaneously improving
    return generation and reducing downside risk relative to every compared method.
  page: 7-9
- name: S&P 500 main results
  desc: '[evidence] Table 1 显示 FaVOR 在 S&P 500 上达到 AR 0.1062、IR 1.1315、MDD −0.0443、CR
    0.1123，同样为所有方法中最佳。[claim] 这种一致性表明 FaVOR 的验证步骤能够泛化到不同的股票市场，在中国 A 股与美国两个 universes
    中都产生有效的因子组合。'
  excerpt:
  - On the S&P 500, FaVOR again attains the best result across all four metrics, reaching
    AR of 0.1062, IR of 1.1315, MDD of −0.0443, and CR of 0.1123. This consistency
    suggests that FaVOR's validation step generalizes across distinct equity markets,
    producing effective factor combinations in both the Chinese A-share and U.S. universes.
  page: 7-9
- name: Cumulative excess return trajectories
  desc: '[evidence] Figure 4 追踪了各方法在两个市场上的累计超额回报曲线。[claim] 在 CSI 500 上 FaVOR 获得了年初的收益并保持它，而大多数基线在年底漂移并转为负值；在
    S&P 500 上 FaVOR 在年初几个月接近零，从年中开始稳定复利，最终成为最强的轨迹。'
  excerpt:
  - Figure 4 traces cumulative excess returns. On the CSI 500, FaVOR captures an early-year
    gain and preserves it while most baselines drift sideways and turn negative by
    year-end. On the S&P 500, FaVOR remains near zero through early months and compounds
    steadily from mid-year onward, ending as the strongest trajectory while most baselines
    stay weakly positive or drift negative.
  page: 8-9
- name: Factor validation separates factors at observation level
  desc: '[evidence] Table 2 报告了单个假设下三个可观测条件（O1 抛售状态、O2 日内反弹、O3 早期稳定）的候选因子验证结果，每个条件的通过与未通过候选因子给出了基于分布证据的推理。[claim]
    因子一致性因此仅通过分布行为在观测层面分离因子，通过/未通过的对比在观测层面独立成立，这正是验证框架所发挥的核心作用。'
  excerpt:
  - The same PASS/FAIL contrast holds for the post sell-off (O1) and early-stabilization
    (O3) observations in Table 2. Factor consistency therefore separates at the observation
    level through distributional behavior alone, which is the central role that our
    validation framework plays.
  page: 9-10
- name: 'Ablation: Stage 2 and Stage 3 are essential'
  desc: '[evidence] Table 4 报告了在 CSI 500 上的消融结果：完整 FaVOR 的 AR 为 0.2067、IR 为 1.5295、MDD
    为 −0.0853；w/o Stage 2 时 AR 降至 0.0492、IR 降至 0.1526、MDD 量级翻倍至 −0.2091；w/o Stage
    3 时 AR 降至 −0.3902；移除两个阶段时所有指标均转负。[claim] 因子验证与整合共同负责可用交易信号的存在，而不仅仅是在已有效流程之上的改进。'
  excerpt:
  - Removing Stage 2 lets unvalidated factors enter the integration stage, and MDD
    more than doubles in magnitude as the integration step admits weaker signals that
    yield little risk-adjusted return. Removing Stage 3 produces the largest deterioration
    in return
  - Removing both stages reduces FaVOR to unconstrained factor generation, and every
    metric in Table 4 turns negative. Factor validation and integration are therefore
    jointly responsible for the existence of usable trading signals, not merely a
    refinement on top of an already-working pipeline.
  page: '10'
- name: Sensitivity to LLM backbone
  desc: '[evidence] Table 3 报告了将默认 GPT-4o 替换为五种替代骨干（GPT-5.4-mini、Gemini-2.5-Flash、Claude-Sonnet-4.6、Llama-3.3-70B、Qwen3-235B）后的结果。[claim]
    FaVOR 在所有评估的骨干上于两个市场均保持正的年化回报和信息比率，表明其有效性不依赖于单一专有模型；开源的 Qwen3-235B 在 CSI 500 上达到
    IR 1.0598，与若干闭源替代方案具有竞争力。'
  excerpt:
  - FaVOR retains positive annualized return (AR) and information ratio (IR) on both
    markets across all evaluated backbones, indicating that its effectiveness is not
    tied to a single proprietary model.
  - On the CSI 500, the open-weight Qwen3-235B achieves an IR of 1.0598 and remains
    competitive with several closed-source alternatives.
  page: 10-11
- name: Run-to-run stability of LLM validation
  desc: '[evidence] Table 10 报告了 10 次独立全流程运行的运行间方差：IR 方差 0.152、AR 方差 0.042、MDD 方差
    0.120、Turnover 方差 0.046。[claim] 较小的量级表明在随机解码下 LLM 验证结果可复现，且 Table 1 中报告的头条性能是稳定的。'
  excerpt:
  - Table 10 reports run-to-run variance. The small magnitudes indicate that validation
    outcomes are reproducible across independent runs and that the performance reported
    in Table 1 is stable.
  page: '17'
- name: Trade-level distribution of gains
  desc: '[evidence] Table 11 报告了 CSI 500 样本外期间的交易级统计：共 1,255 笔交易、平均持有期 9.64 天、每笔交易平均超额回报
    2.279%、盈利因子 1.986、回报的第 10 百分位为 −7.24%、第 90 百分位为 +8.52%。[claim] 聚合数字确认 FaVOR 的累计超额回报广泛分布在许多交易中，而不是由少数极端交易驱动的。'
  excerpt:
  - Table 11 reports trade-level distributional statistics from the CSI 500 out-of-sample
    period, verifying that FaVOR's cumulative excess return is not driven by a small
    number of extreme trades. The aggregated numbers confirm that gains are broadly
    distributed across many trades rather than concentrated in tail events.
  page: 17-18
- name: PASS/FAIL formulas lack standalone RankIC advantage
  desc: '[evidence] Table 14 计算了 Stage 2 PASS 与 FAIL 公式在四个持有期（1/3/5/10 天）上的平均单因子 RankIC，例如
    CSI 500 上 PASS 在 1 天为 +0.0039 而 FAIL 为 +0.0025，S&P 500 上 FAIL 在各期均高于 PASS。[claim]
    PASS 公式并未表现出一致的独立 RankIC 优势，这与 Stage 2 作为语义和分布一致性过滤器而非个体因子回报预测器的角色一致；该过滤器会移除那些有预测性但代表与假设相反市场状态的公式。'
  excerpt:
  - As shown in Table 14, PASS formulas do not exhibit a uniform standalone RankIC
    advantage. This result is consistent with the role of Stage 2 as a semantic and
    distributional consistency filter rather than an individual-factor return predictor.
  - Stage 2 rejects this candidate because its induced OHLCV distribution contradicts
    the stated condition. Thus, the filter removes formulas that may be predictive
    while representing the opposite market state from the hypothesis.
  page: 18-19
- name: Longitudinal evaluation across test years
  desc: '[evidence] Table 17 报告了用 2015–2019 训练、2020 验证选出的固定组合在五个测试年份的表现，例如 CSI 500
    上 2021 年 AR +0.6964 / IR +1.7117、2022 年 AR +0.1356 / IR +0.4543、2023 年 AR +0.3317
    / IR +1.2020。[claim] 固定公式组合在 2022 年市场下跌及随后的多个市场环境中仍然保持有用，表明其价值不局限于单个日历边界。'
  excerpt:
  - Table 17 reports annualized excess return and excess IR across five test years.
    The evaluation covers the 2022 market decline as well as subsequent market environments.
  page: '20'
- name: Expert assessment of semantic validation
  desc: '[evidence] Table 16 报告了 100 个盲评案例（52 个 CSI 500、48 个 S&P 500，平衡 50 个框架 PASS
    与 50 个框架 FAIL 决策）的专家评估结果：39 例一致、49 例部分一致、12 例不一致。[claim] 部分一致是最频繁的结果，专家通常同意观测到的前件条件与陈述的方向性结果，但判断中间市场机制需要进一步讨论；这些结果支持将验证器作为可审计的语义一致性检查使用，但并不意味着验证程序确立了因果或基础经济机制。'
  excerpt:
  - Table 16 summarizes the expert assessment of semantic alignment for the blinded
    evidence packets. Experts judged 39 cases as agreement, 49 cases as partial agreement,
    and 12 cases as disagreement.
  - Partial agreement is the most frequent outcome. ... These results support the
    use of the validator as an auditable semantic consistency check. They do not imply
    that the validation procedure establishes a causal or fundamental economic mechanism.
  page: 19-20
- name: Directional Selectivity rejects unstable but profitable signals
  desc: '[evidence] 附录 M 报告在 212 个评估的 Stage 3 组合中，有 81 个因方向在选择性收紧时未能保持稳定而被拒绝，其中 47
    个在成本后仍获得正的累计回报；Table 20 显示全局选择性 σ 从 0.55 升至 0.95 时，所有 Stage 3 组合的无条件平均累计超额回报从
    +0.2048（CSI 500）降至 +0.0048。[claim] 该过滤器因此排除了一组有利润但方向不稳定的信号（尤其是反弹与恐慌抛售模式），这是将 FaVOR
    限制在方向一致信号上的代价。'
  excerpt:
  - Among 212 evaluated Stage 3 combinations, 81 were rejected because their realized
    direction did not remain stable as selectivity tightened. Of these rejected combinations,
    47 still obtained positive after cost cumulative return in the held out evaluation.
    The filter therefore discards a meaningful set of profitable but directionally
    unstable signals, especially rebound and panic selling patterns.
