paper: 2609.00058.pdf
desc: 该论文提出 CUDA-Harness，一个用于从自然语言生成和优化 CUDA 内核的框架，通过 Intermediate-Structured Generation
  连接语义理解与内核合成，Synthesis-Based Verification 提供隔离测试数据以减轻 reward hacking，以及 Feedback-Adaptive
  Evolution 通过正确性优先精修来优化性能。
concepts:
- name: Intermediate-Structured Generation
  desc: 一种通过生成 kernel implementation manifest 和 self-contained CUDA scaffold 来连接高级语义理解与低级内核合成的方法。
  is_original: true
  excerpt:
  - Given a natural language input, the agent first produces the implementation manifest
    to externalize semantic understanding and implementation planning. For each entry
    in the manifest, the agent then instantiates the CUDA scaffold and focuses on
    the concrete implementation of the corresponding kernel.
  - The kernel implementation manifest is a structured per-kernel specification, where
    each entry stands alone. Each entry records the essential information to implement
    a kernel, including the kernel name, the input and output descriptions of the
    kernel, a functional description that reveals algorithmic detail, and a language-agnostic
    reference code snippet.
  page: 3-4
- name: Synthesis-Based Verification
  desc: 一种通过在隔离环境中合成测试数据并使用渐进式多阶段验证来提供可信正确性信号以减轻 reward hacking 的方法。
  is_original: true
  excerpt:
  - Synthesis-Based Verification decouples test data synthesis from kernel generation,
    allowing the agent to construct test inputs in an isolated environment for validation.
  - However, decoupling test data synthesis is insufficient, as reward hacking can
    still arise through the validation rule due to how the test data is synthesized.
    [...] we require the agent to draw test inputs from a broad numeric range.
  - Given synthesized test data, CUDA-Harness employs a progressive multi-stage protocol
    for kernel validation. [...] CUDA-Harness follows a fail-fast order that checks
    compilation first, then functional correctness, and finally runtime performance.
  page: 4-5
- name: Feedback-Adaptive Evolution
  desc: 一种结合正确性优先精修和奖励驱动优化的内核演化策略，用于在测试时优化内核同时保持正确性。
  is_original: true
  excerpt:
  - Feedback-Adaptive Evolution combines correctness-first refinement and reward-driven
    optimization to perform test-time kernel evolution.
  - If the generated kernel fails to compile, the agent is steered towards a specific
    repair based on the error details provided by the compilation tool. When the kernel
    fails functional validation, the agent is instructed to retreat to a more conservative
    implementation, prioritizing correctness above all else.
  - Building on correctness-first refinement, CUDA-Harness performs reward-driven
    optimization for the test-time kernel evolution.
  page: 5-6
methods:
- name: __overview__
  desc: CUDA-Harness 框架的整体方法论，集成了 Intermediate-Structured Generation、Synthesis-Based
    Verification 和 Feedback-Adaptive Evolution 三个组件。
  excerpt:
  - CUDA-Harness introduces Intermediate-Structured Generation to bridge the gap between
    high-level intents and low-level implementation. We develop Synthesis-Based Verification,
    providing isolated test data synthesis and progressive validation. We propose
    Feedback-Adaptive Evolution to prioritize correctness while optimizing kernel
    performance during test-time evolution.
  page: 2-6
- name: Kernel Implementation Manifest
  desc: 一个结构化的按内核规格说明，每个条目独立记录实现内核所需的基本信息，包括名称、输入/输出描述、功能描述和语言无关的参考代码片段。
  excerpt:
  - The kernel implementation manifest is a structured per-kernel specification, where
    each entry stands alone. Each entry records the essential information to implement
    a kernel, including the kernel name, the input and output descriptions of the
    kernel, a functional description that reveals algorithmic detail, and a language-agnostic
    reference code snippet. Additionally, each entry carries detailed test information,
    encompassing the shapes and data types of the test inputs and outputs.
  page: '4'
- name: Self-Contained CUDA Scaffold
  desc: 一个代码模板，指导代理如何基于 manifest 条目实现自包含的 CUDA 程序，将内核启动相关操作聚合到专用启动器函数中。
  excerpt:
  - The self-contained CUDA scaffold is a code template that tells the agent how to
    implement the self-contained CUDA program based on the manifest entry. Fig. 4
    illustrates a simplified example of the self-contained CUDA scaffold. The scaffold
    includes placeholders for the components of the self-contained CUDA program illustrated
    in Sec. 3.1.
  - Within the scaffold, we aggregate the operations related to kernel launch, including
    memory management, data transfer, and launch configuration definition, into a
    dedicated launcher function rather than scattering it across the host-side code.
  page: '4'
- name: Reward Signal Definition
  desc: 基于编译、功能验证和性能分析的可验证奖励信号，定义为 r(K) = −1 + C(K) + C(K)V(K)P(K)。
  excerpt:
  - Hence, the reward signal can be defined as r(K) = −1 + C(K) + C(K)V(K)P(K)
  - Concretely, a penalty is applied when the generated kernel fails to compile. If
    the kernel compiles and passes functional validation, the performance determines
    the reward, with higher performance yielding a higher reward.
  page: '6'
theorems: []
findings:
- name: Effectiveness of CUDA-Harness
  desc: '[evidence] 在 CUDABench 的所有难度级别上，CUDA-Harness 在编译成功率、功能正确率和运行时性能得分方面均优于基线方法，且性能差距随着难度增加而扩大。'
  excerpt:
  - Across all difficulty levels, CUDA-Harness outperforms the baseline in terms of
    compilation success rate, functional correctness rate, and the performance score,
    demonstrating the effectiveness of CUDA-Harness.
  - As the difficulty level increases, the performance gap between the baseline and
    CUDA-Harness grows, where higher levels indicate less information in the prompt.
  page: 7-8
- name: Ablation Study Results
  desc: '[evidence] CUDA-ISG（仅 Intermediate-Structured Generation）优于基线，证明中间蓝图的有效性；CUDA-Harness*（添加
    Synthesis-Based Verification 和 Reward-Driven Optimization）在编译成功率和性能得分上优于 CUDA-ISG，但功能正确率低于完整
    CUDA-Harness，表明 Correctness-First Refinement 的必要性。'
  excerpt:
  - CUDA-ISG retains only Intermediate-Structured Generation (Sec. 4.1). CUDA-ISG
    outperforms the baseline, demonstrating the effectiveness and the necessity of
    the proposed intermediate blueprints.
  - CUDA-Harness* adds Synthesis-Based Verification (Sec. 4.2) and Reward-Driven Optimization
    (Sec. 4.3.2) on top of CUDA-ISG while withholding Correctness-First Refinement
    (Sec. 4.3.1). Compared with CUDA-ISG, its higher compilation success rate and
    performance score shows that Reward-Driven Optimization is effective at repairing
    compilation failures and optimizing the generated kernels. However, the remaining
    gap to the full CUDA-Harness reveals why Correctness-First Refinement matters.
    Through Correctness-First Refinement, CUDA-Harness achieves a higher functional
    correctness rate than CUDA-Harness*, further confirming the importance of correctness-first
    refinement in preserving correctness throughout the optimization process.
  page: '8'
- name: Consistency of Synthesis-Based Verification
  desc: '[evidence] Synthesis-Based Verification 与基准验证结果的一致性达到 84.4% 准确率，精确率 89.4%，召回率
    91.4%，表明其提供了强有力的正确性信号用于测试时演化。'
  excerpt:
  - As shown in Tab. 2, Synthesis-Based Verification is largely consistent with benchmark
    validation. Treating benchmark validation as the reference and Synthesis-Based
    Verification as the prediction, Table 2 shows an accuracy of 84.4%, with precision
    89.4% and recall 91.4%.
  - These results indicate that Synthesis-Based Verification provides a strong correctness
    signal for test-time evolution.
  page: '8'
- name: Generalization Across LLMs
  desc: '[evidence] CUDA-Harness 在不同底层 LLM（Seed2.0 Lite、DeepSeek V3.2、GLM-5.1）上均优于对应基线，在编译成功率、功能正确率和运行时性能得分方面表现一致，证明其与特定
    LLM 无关的设计。'
  excerpt:
  - As shown in Tab. 3, CUDA-Harness consistently outperforms the corresponding baseline
    across all three LLMs in terms of compilation success rate, functional correctness
    rate, and runtime performance score.
  - These results substantiate the LLM-agnostic design of CUDA-Harness, as its improvements
    do not rely on a specific underlying LLM.
  page: '9'
- name: Generalization Across Hardware Platforms
  desc: '[evidence] CUDA-Harness 在不同硬件平台（NVIDIA A40、GTX 1660 SUPER、Jetson AGX Orin）上保持近似的编译成功率和功能正确率，尽管性能得分随硬件计算能力变化，但始终优于基线，表明其能泛化到不同硬件环境。'
  excerpt:
  - As shown in Tab. 3, the experimental results vary across hardware platforms due
    to differences in software (e.g., compilers) versions and hardware compute capabilities.
    However, CUDA-Harness maintains close compilation success rates and functional
    correctness rates across the three platforms.
  - Although the performance score changes with the hardware compute capability, CUDA-Harness
    consistently outperforms the baseline on each platform. These results demonstrate
    that CUDA-Harness is not tailored to a single hardware environment and can generalize
    across different hardware platforms.
  page: 9-10
- name: Generalization to C-to-CUDA Transpilation
  desc: '[evidence] 在 C-to-CUDA transpilation 场景下（输入为顺序 C 代码），CUDA-Harness 在编译成功率、功能正确率和性能得分方面均优于基线，即使只使用了较小的演化预算（N=1,
    G=1），说明其易于泛化到 C-to-CUDA 任务。'
  excerpt:
  - As shown in Tab. 4, CUDA-Harness outperforms the baseline, even though the evolution
    budget is relatively small, illustrating that CUDA-Harness can easily generalize
    to C-to-CUDA transpilation well.
  - Since Intermediate-Structured Generation is not tied to natural language input,
    decoupling understanding and implementation helps the agent capture the C code
    and generate the CUDA kernel.
  page: '10'
